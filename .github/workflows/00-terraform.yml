name: "Terraform Workflow"

on:
    workflow_call:
        inputs:
            environment:
                description: "The environment to deploy to"
                required: true
                type: string
        secrets:
            AWS_SECRET_ID:
                description: "The AWS Access Key ID"
                required: true
            AWS_SECRET_KEY:
                description: "The AWS Secret Access Key"
                required: true
            AWS_REGION:
                description: "The AWS region to deploy to"
                required: true
            AWS_STATEFILE_S3_BUCKET:
                description: "The name of the S3 bucket to use for Terraform state files"
                required: true
            AWS_LOCK_DYNAMODB_TABLE:
                description: "The name of the DynamoDB table to use for Terraform state locking"
                required: true
jobs:
    terraform:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        steps:
            - name: "Checkout code"
              uses: actions/checkout@v4

            - name: "Set up Terraform"
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.8.3

            - name: "Configure AWS credentials"
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_SECRET_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: "Read destroy configuration"
              id: read-destroy-config
              run: |
                  DESTROY="$(jq -r '.["${{ inputs.environment }}"]' ./infra/destroy_config.json)"
                  echo "destroy=$(echo $DESTROY)" >> $GITHUB_OUTPUT

            - name: "Initialize Terraform"
              run: cd infra && terraform init
                  -backend-config="bucket=${{ secrets.AWS_STATEFILE_S3_BUCKET }}"
                  -backend-config="key=${{ github.event.repository.name }}"
                  -backend-config="region=${{ secrets.AWS_REGION }}"
                  -backend-config="dynamodb_table=${{ secrets.AWS_LOCK_DYNAMODB_TABLE }}"

            - name: "Terraform Validate"
              run: terraform validate

            - name: "Terraform Destroy"
              if: steps.read-destroy-config.outputs.destroy == 'true'
              run: cd infra &&
                  terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
                  terraform destroy -var-file=./envs/${{ inputs.environment }}/terraform.tfvars -auto-approve

            - name: "Plan Terraform changes"
              if: steps.read-destroy-config.outputs.destroy != 'true'
              id: terraform-plan
              run: cd infra &&
                  terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
                  terraform plan -var-file=./envs/${{ inputs.environment }}/terraform.tfvars -out="${{ inputs.environment }}.tfplan"

            - name: "Apply Terraform changes"
              if: steps.read-destroy-config.outputs.destroy != 'true'
              id: terraform-apply
              run: cd infra &&
                  terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} &&
                  terraform apply "${{ inputs.environment }}.tfplan"
